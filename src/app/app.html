<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8 flex flex-col">
  <div class="w-full flex flex-col flex-1">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Hunspell Validator</h1>
      <p class="text-gray-600">Validate spelling with Hunspell rules and dictionaries</p>
    </div>

    <!-- Language Selector Section (Collapsible) -->
    <div class="bg-white rounded-lg shadow-md mb-8 overflow-hidden">
      <button
        (click)="toggleLanguageSelector()"
        class="w-full px-6 py-4 bg-white hover:bg-gray-50 transition-colors duration-200 flex items-center gap-2 text-gray-700 font-semibold text-left"
      >
        <span>{{ showLanguageSelector ? '▼' : '▶' }}</span>
        <span>Load Language Preset</span>
      </button>

      @if (showLanguageSelector) {
        <div class="border-t border-gray-200 p-6 animate-in fade-in duration-200">
          <div class="flex flex-wrap items-end gap-4">
            <div class="flex-1 min-w-64">
              <label for="language-select" class="block text-sm font-semibold text-gray-700 mb-2">
                Select Language
              </label>
              <select
                id="language-select"
                [(ngModel)]="selectedLanguage"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white cursor-pointer"
              >
                <option value="">Choose a language...</option>
                @for (lang of languages; track lang.code) {
                  <option [value]="lang.code">
                    {{ lang.name }}
                  </option>
                }
              </select>
            </div>
            <button
              (click)="loadLanguage()"
              [disabled]="!selectedLanguage || isLoading"
              class="px-4 py-2 bg-gray-400 hover:bg-gray-500 disabled:bg-gray-300 text-white font-semibold rounded-lg transition-colors duration-200"
            >
              {{ isLoading ? 'Loading...' : 'Load' }}
            </button>
          </div>
        </div>
      }
    </div>

    <!-- Three Column Layout -->
    <div class="grid grid-cols-3 gap-6 flex-1 min-h-0">
      <!-- Left Column: .aff File -->
      <app-monaco-editor
        [content]="affContent"
        (contentChange)="onAffContentChange($event)"
        [editorOptions]="affEditorOptions"
        title="Affix Rules (.aff)"
      ></app-monaco-editor>

      <!-- Center Column: .dic File -->
      <app-monaco-editor
        [content]="dicContent"
        (contentChange)="onDicContentChange($event)"
        [editorOptions]="dicEditorOptions"
        title="Dictionary (.dic)"
      ></app-monaco-editor>

      <!-- Right Column: Text to Validate with Tiptap -->
      <div class="flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-gray-300 px-6 py-3 border-b border-gray-400 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-800">Text to Validate</h2>
          @if (isRebuildingSpellchecker) {
            <div class="flex items-center gap-2">
              <div class="w-4 h-4 border-2 border-gray-400 border-t-gray-800 rounded-full animate-spin"></div>
              <span class="text-sm text-gray-600">Rebuilding...</span>
            </div>
          }
        </div>
        <div class="flex-1 overflow-hidden p-4" spellcheck="false">
          <app-tiptap-editor
            [content]="textToValidate"
            [editable]="true"
          ></app-tiptap-editor>
        </div>
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-sm text-gray-600">
          {{ textToValidate.length }} characters
        </div>
      </div>
    </div>
  </div>
</div>
