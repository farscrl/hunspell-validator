<div class="h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8 flex flex-col">
  <div class="w-full flex flex-col flex-1">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Hunspell Validator</h1>
      <p class="text-gray-600">Validate spelling with Hunspell rules and dictionaries</p>
    </div>

    <!-- Language Selector Toggle -->
    <button
      (click)="toggleLanguageSelector()"
      class="mb-6 px-4 py-2 bg-white rounded-lg shadow-md hover:shadow-lg hover:bg-gray-50 transition-all duration-200 flex items-center gap-2 text-gray-700 font-semibold"
    >
      <span>{{ showLanguageSelector ? '▼' : '▶' }}</span>
      <span>Load Language Preset</span>
    </button>

    <!-- Language Selector Section (Collapsible) -->
    @if (showLanguageSelector) {
      <div class="bg-white rounded-lg shadow-md p-6 mb-8 animate-in fade-in duration-200">
        <div class="flex flex-wrap items-end gap-4">
          <div class="flex-1 min-w-64">
            <label for="language-select" class="block text-sm font-semibold text-gray-700 mb-2">
              Select Language
            </label>
            <select
              id="language-select"
              [(ngModel)]="selectedLanguage"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white cursor-pointer"
            >
              <option value="">Choose a language...</option>
              @for (lang of languages; track lang.code) {
                <option [value]="lang.code">
                  {{ lang.name }}
                </option>
              }
            </select>
          </div>
          <button
            (click)="loadLanguage()"
            [disabled]="!selectedLanguage || isLoading"
            class="px-6 py-2 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 text-white font-semibold rounded-lg transition-colors duration-200"
          >
            {{ isLoading ? 'Loading...' : 'Load Language' }}
          </button>
          <button
            (click)="clearAll()"
            class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg transition-colors duration-200"
          >
            Clear All
          </button>
        </div>
      </div>
    }

    <!-- Three Column Layout -->
    <div class="grid grid-cols-3 gap-6 flex-1 min-h-0">
      <!-- Left Column: .aff File -->
      <div class="flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-4">
          <h2 class="text-xl font-semibold text-white">Affix Rules (.aff)</h2>
        </div>
        <div class="flex-1 p-4 overflow-y-auto">
          <textarea
            [(ngModel)]="affContent"
            placeholder="Paste your .aff file content here..."
            class="w-full h-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
          ></textarea>
        </div>
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-sm text-gray-600">
          {{ getLineCount(affContent) }} lines
        </div>
      </div>

      <!-- Center Column: .dic File -->
      <div class="flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-purple-500 to-purple-600 px-6 py-4">
          <h2 class="text-xl font-semibold text-white">Dictionary (.dic)</h2>
        </div>
        <div class="flex-1 p-4 overflow-y-auto">
          <textarea
            [(ngModel)]="dicContent"
            placeholder="Paste your .dic file content here..."
            class="w-full h-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none"
          ></textarea>
        </div>
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-sm text-gray-600">
          {{ getLineCount(dicContent) }} lines
        </div>
      </div>

      <!-- Right Column: Text to Validate -->
      <div class="flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-4">
          <h2 class="text-xl font-semibold text-white">Text to Validate</h2>
        </div>
        <div class="flex-1 p-4 overflow-y-auto">
          <textarea
            [(ngModel)]="textToValidate"
            placeholder="Enter text to validate..."
            class="w-full h-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none"
          ></textarea>
        </div>
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 text-sm text-gray-600">
          {{ textToValidate.length }} characters
        </div>
      </div>
    </div>
  </div>
</div>
